server.port=8082

# --- Load .env file automatically ---
spring.config.import=optional:file:.env[.properties]

# --- Database (credentials from .env) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/spacedock
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false 
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- SpaceDock Security ---
spacedock.api-key=${SPACEDOCK_API_KEY}
spacedock.webhook-secret=${SPACEDOCK_WEBHOOK_SECRET}
spacedock.encryption-key=${SPACEDOCK_ENCRYPTION_KEY}
spacedock.allowed-origin=${SPACEDOCK_ALLOWED_ORIGIN}