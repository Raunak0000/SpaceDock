version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: spacedock-db
    env_file:
      - .env
    environment:
      POSTGRES_DB: spacedock
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - spacedock-data:/var/lib/postgresql/data

  caddy:
    image: caddy:2-alpine
    container_name: spacedock-caddy
    network_mode: host
    volumes:
      - caddy-data:/data
      - ./Caddyfile:/etc/caddy/Caddyfile

volumes:
  spacedock-data:
  caddy-data:
